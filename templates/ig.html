{% extends "tool_base.html" %}
{% block body_attrs %} class="pin ig"{% endblock %}
{% block form %}
<form id="form" class="searchbar" novalidate>
  <label for="url" class="sr-only">Instagram link or username</label>
  <input type="text" id="url" inputmode="url" placeholder="{{ page.ph }}" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button type="button" id="paste" class="ghost">Paste</button>
  <button type="submit" id="go" class="primary">Get media</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
{% endblock %}
{% block results %}<section id="results" class="board" aria-label="Results"></section>{% endblock %}
{% block tool_script %}
<script>
(() => {
  const MODE = {{ page.get("mode", "auto")|tojson }};
  const form = document.getElementById('form'), field = document.getElementById('url'), goBtn = document.getElementById('go');
  const statusEl = document.getElementById('status'), board = document.getElementById('results');
  function setStatus(t, err = false) { statusEl.textContent = t; statusEl.classList.toggle('is-error', err); }
  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) { if (k === 'class') n.className = v; else if (k in n) n[k] = v; else n.setAttribute(k, v); }
    n.append(...kids); return n;
  }
  function parseInput(text) {
    const m = text.match(/(?:https?:\/\/)?(?:www\.)?(?:instagram\.com|instagr\.am)\/[^\s"'<>]+/i);
    return m ? m[0] : text.trim();
  }
  async function readError(res, fallback) { try { return (await res.json()).error || fallback; } catch (_) { return fallback; } }
  function filenameFrom(res, fallback) {
    const m = (res.headers.get('Content-Disposition') || '').match(/filename="?([^";]+)"?/i);
    return m ? m[1] : fallback;
  }

  const MP3 = MODE === 'mp3';
  function previewUrl(source, index) { return `/ig/preview?u=${encodeURIComponent(source)}&i=${index}&mode=${MODE}`; }

  function itemCard(item, source, i) {
    const print = el('div', { class: 'print' });
    if (item.thumbnail || item.kind === 'dp' || item.kind === 'image') {
      const img = el('img', { src: previewUrl(source, item.index), alt: item.label, loading: 'lazy', referrerPolicy: 'no-referrer' });
      img.addEventListener('error', () => {
        if (item.thumbnail && !img.dataset.fb) { img.dataset.fb = '1'; img.src = item.thumbnail; }
      });
      print.append(img);
    }
    print.append(el('span', { class: 'kind' }, item.label));
    const idle = MP3 ? 'Download MP3' : 'Download';
    const btn = el('button', { type: 'button', class: 'primary' }, idle);
    const note = el('p', { class: 'note', hidden: true });
    if (item.kind === 'dp' && parseInt(item.size, 10) && parseInt(item.size, 10) < 400) {
      note.hidden = false; note.textContent = 'This is the biggest version Instagram gave us right now.';
    }
    const bar = window.mdBar(btn, 'after');
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = MP3 ? 'Converting…' : 'Preparing…'; bar.wait((typeof MP3 !== 'undefined' && MP3) ? 'Converting the sound to MP3…' : 'The server is preparing your file…'); note.hidden = true; note.className = 'note';
      try {
        const res = await fetch(MP3 ? `/ig/mp3?u=${encodeURIComponent(source)}&i=${item.index}` : `/ig/download?u=${encodeURIComponent(source)}&i=${item.index}&mode=${MODE}`);
        if (!res.ok) throw new Error(await readError(res, 'Download failed. Please try again.'));
        const total = +res.headers.get('Content-Length') || 0, reader = res.body.getReader(), parts = []; let got = 0;
        for (;;) {
          const { done, value } = await reader.read(); if (done) break;
          parts.push(value); got += value.length;
          if (total) { btn.textContent = `Downloading ${Math.round(got / total * 100)}%`; bar.set(got / total, `Downloading ${Math.round(got / total * 100)}%`); } else bar.wait('Downloading…');
        }
        bar.set(1, 'Saving the file…');
        const a = el('a', { href: URL.createObjectURL(new Blob(parts)), download: filenameFrom(res, MP3 ? item.filename.replace(/\.mp4$/i, '.mp3') : item.filename) });
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 15000);
        bar.done('Done. Check your Downloads folder.');
        btn.textContent = 'Saved. ' + idle + ' again';
      } catch (e) { bar.end();
        btn.textContent = idle; note.hidden = false; note.textContent = e.message || 'Download failed.'; note.classList.add('is-error');
      } finally { btn.disabled = false; }
    });
    const caption = el('div', { class: 'caption' },
      el('p', { class: 'file' }, item.size ? `${item.filename} (${item.size})` : item.filename), btn, note);
    if (MP3) {   // listen to the sound before saving it
      const audio = el('audio', { controls: true, preload: 'none', hidden: true });
      const listen = el('button', { type: 'button', class: 'secondary' }, 'Listen first');
      const pbar = window.mdBar(listen, 'after');
      listen.addEventListener('click', async () => {
        const url = `/ig/mp3?u=${encodeURIComponent(source)}&i=${item.index}&inline=1`;
        listen.disabled = true; note.hidden = true; note.className = 'note'; pbar.wait('Making the preview. This takes a few seconds…');
        try {
          const probe = await fetch(url, { headers: { Range: 'bytes=0-0' } });      // starts the conversion and shows any error
          if (!probe.ok) throw new Error(await readError(probe, 'The preview could not be made.'));
          audio.src = url; audio.hidden = false; await audio.play().catch(() => {});
          listen.textContent = 'Play again';
        } catch (e) { note.hidden = false; note.textContent = e.message || 'The preview could not be made.'; note.classList.add('is-error'); }
        finally { pbar.end(); listen.disabled = false; }
      });
      caption.insertBefore(listen, btn); caption.insertBefore(audio, note);
    }
    if (item.kind !== 'video') {
      caption.append(el('a', { class: 'view', href: previewUrl(source, item.index), target: '_blank', rel: 'noopener' }, 'View full size'));
    }
    return el('article', { class: 'card' + (item.kind === 'dp' ? ' dp' : ''), style: `--i:${i}` }, print, caption);
  }

  const lookupBar = window.mdBar(form, 'after');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const hop = window.mdRoute(field.value); if (hop) { location.href = hop + '?u=' + encodeURIComponent(field.value.trim()); return; }
    const source = parseInput(field.value);
    if (!source) { setStatus('Paste an Instagram link or username first.', true); field.focus(); return; }
    lookupBar.wait('Looking up the link…');
    goBtn.disabled = true; goBtn.textContent = 'Looking up…'; board.replaceChildren();
    board.append(el('article', { class: 'card' }, el('div', { class: 'print' }, el('div', { class: 'skeleton' }))));
    setStatus('Looking it up. This can take up to a minute if the server was asleep.');
    try {
      const res = await fetch('/api/ig/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: source, mode: MODE }) });
      if (!res.ok) throw new Error(await readError(res, `The server is busy or waking up (code ${res.status}). Please try again in a minute.`));
      const data = await res.json();
      const items = MP3 ? data.items.filter(it => it.kind === 'video') : data.items;
      if (!items.length) throw new Error('This link has no video to convert. Paste the link of a Reel or a video post.');
      board.replaceChildren(...items.map((it, i) => itemCard(it, source, i)));
      setStatus(items.length > 1 ? `${data.title}: ${items.length} items found.` : data.title);
    } catch (err) {
      board.replaceChildren(); setStatus(err.message || "Couldn't reach the server. Check your connection and try again.", true);
    } finally { lookupBar.end(); goBtn.disabled = false; goBtn.textContent = 'Get media'; }
  });

  document.getElementById('paste').addEventListener('click', async () => {
    try { field.value = await navigator.clipboard.readText(); form.requestSubmit(); }
    catch (_) { setStatus('Your browser blocked clipboard access. Paste with Ctrl+V (or long-press) instead.', true); field.focus(); }
  });
})();
</script>
<script>(() => { const pre = new URLSearchParams(location.search).get('u'); const f = document.getElementById('url');
  if (pre && f) { f.value = pre; f.dispatchEvent(new Event('input')); document.getElementById('form').requestSubmit(); } })();</script>
{% endblock %}
